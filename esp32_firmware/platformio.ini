[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.psram = enable
board_build.psram_mode = opi
board_build.psram_type = 8mb
board_build.partitions = partitions_model.csv

; Custom partition table for model binary
board_upload.partition_table = custom
board_upload.partition_tool = gen_esp32part

; Optimize for speed
build_unflags = -Os
build_flags =
    -O2
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; Monitor speed
monitor_speed = 115200
