<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" font-family="sans-serif">
  <defs>
    <style>
      .title { font-size: 41px; font-weight: 700; fill: #1a1a1a; }
      .subtitle { font-size: 22px; fill: #555; }
      .module { fill: #f7f7f7; stroke: #444; stroke-width: 1.6; }
      .module-title { font-size: 24px; font-weight: 700; fill: #222; text-anchor: middle; }
      .module-sub { font-size: 18px; fill: #666; text-anchor: middle; }
      .pinlabel { font-size: 17px; font-family: monospace; fill: #333; }
      .note { font-size: 18px; fill: #777; }
    </style>
  </defs>

  <rect width="1280" height="900" fill="#ffffff"/>

  <!-- ===================== TITLE ===================== -->
  <text x="640" y="40" text-anchor="middle" class="title">Battery Failure Predictor — Prototype Wiring (Breadboard)</text>
  <text x="640" y="62" text-anchor="middle" class="subtitle">ESP32-S3-DevKitC-1 · INA219 · DS3231 · DS18B20 · 2:1 divider — matches firmware pins GPIO1/8/9/10</text>

  <!-- ===================== POWER RAILS ===================== -->
  <line x1="60" y1="70" x2="1220" y2="70" stroke="#d32f2f" stroke-width="4"/>
  <text x="60" y="60" class="pinlabel" fill="#d32f2f" font-weight="bold">3V3</text>
  <line x1="60" y1="830" x2="1220" y2="830" stroke="#222222" stroke-width="4"/>
  <text x="60" y="820" class="pinlabel" fill="#222" font-weight="bold">GND</text>

  <!-- ===================== CURRENT / POWER PATH (thick) ===================== -->
  <!-- battery+ sense -> divider -->
  <path d="M200 140 H390 V320" fill="none" stroke="#d32f2f" stroke-width="4"/>
  <!-- battery+ current -> INA219 VIN+ -->
  <path d="M200 140 H60 V370" fill="none" stroke="#d32f2f" stroke-width="4"/>
  <!-- INA219 VIN- -> Load + -->
  <path d="M60 450 V580 H190" fill="none" stroke="#d32f2f" stroke-width="4"/>
  <!-- Load - -> GND -->
  <path d="M190 670 V830" fill="none" stroke="#d32f2f" stroke-width="4"/>
  <!-- battery- -> GND -->
  <path d="M200 250 H40 V830 H60" fill="none" stroke="#222222" stroke-width="4"/>

  <!-- ===================== 3V3 DROPS ===================== -->
  <path d="M600 240 V70" fill="none" stroke="#d32f2f" stroke-width="2.5"/>
  <path d="M340 370 H350 V70" fill="none" stroke="#d32f2f" stroke-width="2.5"/>
  <path d="M840 400 V70" fill="none" stroke="#d32f2f" stroke-width="2.5"/>
  <path d="M840 640 H820 V70" fill="none" stroke="#d32f2f" stroke-width="2.5"/>

  <!-- ===================== GND DROPS ===================== -->
  <path d="M340 480 V830" fill="none" stroke="#222222" stroke-width="2.5"/>
  <path d="M390 440 V830" fill="none" stroke="#222222" stroke-width="2.5"/>
  <path d="M600 560 V830" fill="none" stroke="#222222" stroke-width="2.5"/>
  <path d="M840 490 H790 V830" fill="none" stroke="#222222" stroke-width="2.5"/>
  <path d="M840 740 V830" fill="none" stroke="#222222" stroke-width="2.5"/>

  <!-- ===================== I2C SDA / SCL (straight daisy chain) ===================== -->
  <path d="M340 430 H440" fill="none" stroke="#f2b705" stroke-width="2.5"/>
  <path d="M760 430 H840" fill="none" stroke="#f2b705" stroke-width="2.5"/>
  <path d="M340 460 H440" fill="none" stroke="#2e7d32" stroke-width="2.5"/>
  <path d="M760 460 H840" fill="none" stroke="#2e7d32" stroke-width="2.5"/>

  <!-- ===================== ONEWIRE (DS18B20 DQ) ===================== -->
  <path d="M760 540 H840 V690" fill="none" stroke="#1565c0" stroke-width="2.5"/>
  <!-- 4.7k pullup DQ -> 3V3 -->
  <path d="M800 540 V70" fill="none" stroke="#1565c0" stroke-width="2.5"/>
  <rect x="787" y="320" width="26" height="44" fill="#ffffff" stroke="#666" stroke-width="1.4"/>
  <text x="800" y="338" text-anchor="middle" class="note" font-size="15">R3</text>
  <text x="800" y="352" text-anchor="middle" class="note" font-size="14">4.7kΩ</text>

  <!-- ===================== ADC (GPIO1) ===================== -->
  <path d="M390 380 H440" fill="none" stroke="#9e9e9e" stroke-width="2.5"/>

  <!-- ===================== DIVIDER RESISTORS ===================== -->
  <rect x="377" y="320" width="26" height="60" fill="#ffffff" stroke="#666" stroke-width="1.4"/>
  <text x="412" y="342" class="note">R1</text>
  <text x="412" y="356" class="note">10kΩ</text>
  <rect x="377" y="380" width="26" height="60" fill="#ffffff" stroke="#666" stroke-width="1.4"/>
  <text x="412" y="402" class="note">R2</text>
  <text x="412" y="416" class="note">10kΩ</text>
  <text x="390" y="312" text-anchor="middle" class="note">2:1 divider (4.2V → 2.1V)</text>

  <!-- ===================== JUNCTION DOTS ===================== -->
  <circle cx="200" cy="140" r="4" fill="#d32f2f"/>
  <circle cx="390" cy="380" r="4" fill="#333"/>
  <circle cx="800" cy="540" r="4" fill="#1565c0"/>

  <!-- ===================== BATTERY ===================== -->
  <g>
    <rect x="60" y="140" width="280" height="110" rx="8" class="module"/>
    <text x="200" y="175" class="module-title">18650 cell</text>
    <text x="200" y="193" class="module-sub">battery under test (3.7 V)</text>
    <circle cx="200" cy="140" r="3.5" fill="#d32f2f"/>
    <text x="192" y="133" text-anchor="end" class="pinlabel" fill="#d32f2f" font-weight="bold">+</text>
    <circle cx="200" cy="250" r="3.5" fill="#222"/>
    <text x="192" y="266" text-anchor="end" class="pinlabel" fill="#222" font-weight="bold">−</text>
  </g>

  <!-- ===================== INA219 ===================== -->
  <g>
    <rect x="60" y="340" width="280" height="140" rx="8" class="module"/>
    <text x="200" y="370" class="module-title">INA219</text>
    <text x="200" y="387" class="module-sub">current sensor · I2C 0x40 · 0.1Ω shunt</text>
    <circle cx="60" cy="370" r="3.5" fill="#d32f2f"/>
    <text x="68" y="365" class="pinlabel">VIN+</text>
    <circle cx="60" cy="450" r="3.5" fill="#d32f2f"/>
    <text x="68" y="445" class="pinlabel">VIN−</text>
    <circle cx="340" cy="370" r="3.5" fill="#d32f2f"/>
    <text x="332" y="365" text-anchor="end" class="pinlabel">VCC</text>
    <circle cx="340" cy="430" r="3.5" fill="#f2b705"/>
    <text x="332" y="425" text-anchor="end" class="pinlabel">SDA</text>
    <circle cx="340" cy="460" r="3.5" fill="#2e7d32"/>
    <text x="332" y="455" text-anchor="end" class="pinlabel">SCL</text>
    <circle cx="340" cy="480" r="3.5" fill="#222"/>
    <text x="332" y="475" text-anchor="end" class="pinlabel">GND</text>
  </g>

  <!-- ===================== LOAD ===================== -->
  <g>
    <rect x="60" y="580" width="260" height="90" rx="8" class="module"/>
    <text x="190" y="610" class="module-title">Load</text>
    <text x="190" y="628" class="module-sub">discharge resistor / charger</text>
    <circle cx="190" cy="580" r="3.5" fill="#d32f2f"/>
    <text x="182" y="573" text-anchor="end" class="pinlabel" fill="#d32f2f">+</text>
    <circle cx="190" cy="670" r="3.5" fill="#222"/>
    <text x="182" y="686" text-anchor="end" class="pinlabel" fill="#222">−</text>
  </g>

  <!-- ===================== ESP32-S3 DevKitC ===================== -->
  <g>
    <rect x="440" y="240" width="320" height="320" rx="8" class="module"/>
    <text x="600" y="290" class="module-title">ESP32-S3-DevKitC-1</text>
    <text x="600" y="310" class="module-sub">3 tree models on-board (N16R8)</text>
    <text x="600" y="328" class="module-sub">USB → UART / dashboard</text>

    <circle cx="600" cy="240" r="3.5" fill="#d32f2f"/>
    <text x="600" y="232" text-anchor="middle" class="pinlabel" fill="#d32f2f">3V3</text>
    <circle cx="600" cy="560" r="3.5" fill="#222"/>
    <text x="600" y="580" text-anchor="middle" class="pinlabel">GND</text>

    <circle cx="440" cy="380" r="3.5" fill="#9e9e9e"/>
    <text x="448" y="375" class="pinlabel">GPIO1 · ADC</text>
    <circle cx="440" cy="430" r="3.5" fill="#f2b705"/>
    <text x="448" y="425" class="pinlabel">GPIO8 · SDA</text>
    <circle cx="440" cy="460" r="3.5" fill="#2e7d32"/>
    <text x="448" y="455" class="pinlabel">GPIO9 · SCL</text>

    <circle cx="760" cy="430" r="3.5" fill="#f2b705"/>
    <text x="752" y="425" text-anchor="end" class="pinlabel">SDA</text>
    <circle cx="760" cy="460" r="3.5" fill="#2e7d32"/>
    <text x="752" y="455" text-anchor="end" class="pinlabel">SCL</text>
    <circle cx="760" cy="540" r="3.5" fill="#1565c0"/>
    <text x="752" y="535" text-anchor="end" class="pinlabel">GPIO10 · OneWire</text>
  </g>

  <!-- ===================== DS3231 ===================== -->
  <g>
    <rect x="840" y="380" width="380" height="120" rx="8" class="module"/>
    <text x="1030" y="412" class="module-title">DS3231 RTC</text>
    <text x="1030" y="430" class="module-sub">I2C 0x68 · CR2032 backup</text>
    <circle cx="840" cy="400" r="3.5" fill="#d32f2f"/>
    <text x="848" y="395" class="pinlabel">VCC</text>
    <circle cx="840" cy="430" r="3.5" fill="#f2b705"/>
    <text x="848" y="425" class="pinlabel">SDA</text>
    <circle cx="840" cy="460" r="3.5" fill="#2e7d32"/>
    <text x="848" y="455" class="pinlabel">SCL</text>
    <circle cx="840" cy="490" r="3.5" fill="#222"/>
    <text x="848" y="485" class="pinlabel">GND</text>
  </g>

  <!-- ===================== DS18B20 ===================== -->
  <g>
    <rect x="840" y="600" width="380" height="160" rx="8" class="module"/>
    <text x="1030" y="634" class="module-title">DS18B20</text>
    <text x="1030" y="652" class="module-sub">OneWire temperature (TO-92)</text>
    <circle cx="840" cy="640" r="3.5" fill="#d32f2f"/>
    <text x="848" y="635" class="pinlabel">VDD</text>
    <circle cx="840" cy="690" r="3.5" fill="#1565c0"/>
    <text x="848" y="685" class="pinlabel">DQ</text>
    <circle cx="840" cy="740" r="3.5" fill="#222"/>
    <text x="848" y="735" class="pinlabel">GND</text>
  </g>

  <!-- ===================== NOTES ===================== -->
  <text x="60" y="872" class="note" font-weight="bold">Notes:</text>
  <text x="60" y="888" class="note">· Breakout modules (INA219, DS3231) carry their own I2C pull-ups — do NOT add extra on SDA/SCL. Only the DS18B20 data line needs R3 (4.7kΩ → 3V3).</text>
  <text x="60" y="903" class="note">· Use the 3.3V rail only — never apply 5V to GPIOs.   · Discharge loop: battery+ → INA219 (VIN+→VIN−) → Load → GND → battery−; divider senses battery+ at VIN+.</text>

  <!-- ===================== LEGEND ===================== -->
  <g class="note">
    <line x1="60" y1="925" x2="100" y2="925" stroke="#d32f2f" stroke-width="4"/>
    <text x="108" y="929">3V3 / battery+</text>
    <line x1="250" y1="925" x2="290" y2="925" stroke="#222222" stroke-width="4"/>
    <text x="298" y="929">GND / battery−</text>
    <line x1="450" y1="925" x2="490" y2="925" stroke="#f2b705" stroke-width="2.5"/>
    <text x="498" y="929">SDA (GPIO8)</text>
    <line x1="640" y1="925" x2="680" y2="925" stroke="#2e7d32" stroke-width="2.5"/>
    <text x="688" y="929">SCL (GPIO9)</text>
    <line x1="830" y1="925" x2="870" y2="925" stroke="#1565c0" stroke-width="2.5"/>
    <text x="878" y="929">OneWire (GPIO10)</text>
    <line x1="1050" y1="925" x2="1090" y2="925" stroke="#9e9e9e" stroke-width="2.5"/>
    <text x="1098" y="929">ADC (GPIO1)</text>
  </g>
</svg>
